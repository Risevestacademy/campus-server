packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  # One version per tool across the workspace. Referenced as
  # "catalog:" in each package, so the apps cannot drift onto
  # different compilers or test runners without anyone noticing.
  '@types/node': ^24.0.0
  'oxlint': ^1.58.0
  'pino-pretty': ^13.1.3
  'postgres': ^3.4.9
  'typescript': ^6.0.2
  'vitest': ^4.1.2

onlyBuiltDependencies:
  - esbuild
